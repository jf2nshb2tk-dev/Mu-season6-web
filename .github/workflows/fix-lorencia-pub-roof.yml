name: Fix Lorencia Pub Roof

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-lorencia-pub-roof.yml'
      - 'scripts/fix_lorencia_pub_roof.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Lorencia pub roof behavior
        run: python3 scripts/fix_lorencia_pub_roof.py

      - name: Validate JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const m=s.match(/<script>([\s\S]*?)<\/script>/);
          if(!m) throw new Error('script not found');
          new Function(m[1]);
          console.log('JavaScript syntax OK');
          NODE

      - name: Commit roof fix
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Hide Lorencia pub roof while player is inside'
          git push origin HEAD:main
