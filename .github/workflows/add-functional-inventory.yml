name: Add functional MU inventory

# Triggered once to import the original Season 6 item assets and integrate the functional inventory.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-functional-inventory.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original client items
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/jf2nshb2tk-dev/reino-de-ceniza/releases/download/Mu-client-s6/ClientS6.Base.rar' \
            -o /tmp/ClientS6.Base.rar
          sudo apt-get update -qq
          sudo apt-get install -y unar >/dev/null
          rm -rf /tmp/mu && mkdir -p /tmp/mu
          unar -q -o /tmp/mu /tmp/ClientS6.Base.rar
          mkdir -p assets/Item
          python3 - <<'PY'
          from pathlib import Path
          import struct, shutil
          root=Path('/tmp/mu/ClientS6 Base/Data/Item')
          out=Path('assets/Item')
          selected=['Staff01.bmd','Potion02.bmd','Potion05.bmd','Jewel01.bmd','Jewel02.bmd']
          filemap={p.name.lower():p for p in root.iterdir() if p.is_file()}
          key=[0xD1,0x73,0x52,0xF6,0xD2,0x9A,0xCB,0x27,0x3E,0xAF,0x59,0x31,0x37,0xB3,0xE7,0xA2]
          def dec(src):
              outb=bytearray(len(src)); mk=0x5E
              for i,v in enumerate(src):
                  outb[i]=((v^key[i&15])-mk)&255
                  mk=(v+0x3D)&255
              return bytes(outb)
          def textures(raw):
              b=raw
              if b[:3]!=b'BMD': raise ValueError('not BMD')
              if b[3]==12:
                  size=struct.unpack_from('<i',b,4)[0]
                  b=b[:4]+dec(b[8:8+size])
              p=36
              mc,bc,ac=struct.unpack_from('<HHH',b,p); p+=6
              tex=[]
              for _ in range(mc):
                  nv,nn,nt,ntr=struct.unpack_from('<hhhh',b,p); p+=10
                  p+=nv*16+nn*20+nt*8+ntr*64
                  name=b[p:p+32].split(b'\0',1)[0].decode('latin1','ignore').replace('\\','/').split('/')[-1]; p+=32
                  if name: tex.append(name)
              return tex
          copied=[]
          for wanted in selected:
              src=filemap.get(wanted.lower())
              if not src: raise SystemExit('Missing original item model: '+wanted)
              shutil.copy2(src,out/wanted); copied.append(wanted)
              for tex in textures(src.read_bytes()):
                  stem=Path(tex).stem
                  expected=stem+('.OZT' if Path(tex).suffix.lower()=='.tga' else '.OZJ')
                  cand=filemap.get(expected.lower())
                  if not cand:
                      alt=stem+('.OZT' if expected.lower().endswith('.ozj') else '.OZJ')
                      cand=filemap.get(alt.lower())
                  if not cand:
                      print('WARN missing texture',wanted,tex)
                      continue
                  shutil.copy2(cand,out/expected); copied.append(expected)
          print('Imported:',', '.join(sorted(set(copied),key=str.lower)))
          PY

      - name: Integrate functional inventory
        run: python3 .github/scripts/patch-functional-inventory.py

      - name: Validate JavaScript and required assets
        shell: bash
        run: |
          set -euo pipefail
          node --check functional-inventory.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          for i,script in enumerate(scripts):
              Path(f'/tmp/app-{i}.js').write_text(script)
          PY
          for f in /tmp/app-*.js; do node --check "$f"; done
          grep -q 'functional-inventory.js?v=1' index.html
          grep -q 'muEquipmentVisualTick(playerScene)' index.html
          test -f assets/Item/Staff01.bmd
          test -f assets/Item/Potion02.bmd
          test -f assets/Item/Potion05.bmd
          test -f assets/Item/Jewel01.bmd
          test -f assets/Item/Jewel02.bmd

      - name: Commit functional inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/Item
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'Add functional original MU inventory items'
          git push origin HEAD:main
