name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import original MU assets once
        shell: bash
        run: |
          set -euo pipefail
          NEED_WORLD=0
          NEED_OBJECT1=0
          [ -f "assets/World1/TerrainHeight.OZB" ] && [ -f "assets/World1/Terrain.obj" ] || NEED_WORLD=1
          [ -f "assets/Object1/Tree01.bmd" ] && [ -f "assets/Object1/House01.bmd" ] || NEED_OBJECT1=1
          if [ "$NEED_WORLD" = 1 ] || [ "$NEED_OBJECT1" = 1 ]; then
            echo "Importing original MU Season 6 assets..."
            curl --fail --location --retry 3 \
              "https://github.com/jf2nshb2tk-dev/reino-de-ceniza/releases/download/Mu-client-s6/ClientS6.Base.rar" \
              -o /tmp/ClientS6.Base.rar
            sudo apt-get update -qq
            sudo apt-get install -y unar
            rm -rf /tmp/mu
            mkdir -p /tmp/mu
            unar -q -o /tmp/mu /tmp/ClientS6.Base.rar
            mkdir -p assets
            if [ "$NEED_WORLD" = 1 ]; then
              rm -rf assets/World1
              cp -R "/tmp/mu/ClientS6 Base/Data/World1" assets/World1
            fi
            if [ "$NEED_OBJECT1" = 1 ]; then
              rm -rf assets/Object1
              cp -R "/tmp/mu/ClientS6 Base/Data/Object1" assets/Object1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/World1 assets/Object1 2>/dev/null || true
            git commit -m "Import original Lorencia Object1 assets" || true
            git push origin HEAD:main
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
