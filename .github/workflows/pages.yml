name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import original MU assets once
        shell: bash
        run: |
          set -euo pipefail
          NEED_WORLD=0
          NEED_OBJECT1=0
          NEED_PLAYER=0
          [ -f "assets/World1/TerrainHeight.OZB" ] && [ -f "assets/World1/Terrain.obj" ] || NEED_WORLD=1
          [ -f "assets/Object1/Tree01.bmd" ] && [ -f "assets/Object1/House01.bmd" ] || NEED_OBJECT1=1
          [ -f "assets/Player/player.bmd" ] || NEED_PLAYER=1
          if [ "$NEED_WORLD" = 1 ] || [ "$NEED_OBJECT1" = 1 ] || [ "$NEED_PLAYER" = 1 ]; then
            echo "Importing original MU Season 6 assets..."
            curl --fail --location --retry 3 \
              "https://github.com/jf2nshb2tk-dev/reino-de-ceniza/releases/download/Mu-client-s6/ClientS6.Base.rar" \
              -o /tmp/ClientS6.Base.rar
            sudo apt-get update -qq
            sudo apt-get install -y unar
            rm -rf /tmp/mu
            mkdir -p /tmp/mu
            unar -q -o /tmp/mu /tmp/ClientS6.Base.rar
            mkdir -p assets
            if [ "$NEED_WORLD" = 1 ]; then
              rm -rf assets/World1
              cp -R "/tmp/mu/ClientS6 Base/Data/World1" assets/World1
            fi
            if [ "$NEED_OBJECT1" = 1 ]; then
              rm -rf assets/Object1
              cp -R "/tmp/mu/ClientS6 Base/Data/Object1" assets/Object1
            fi
            if [ "$NEED_PLAYER" = 1 ]; then
              rm -rf assets/Player
              cp -R "/tmp/mu/ClientS6 Base/Data/Player" assets/Player
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/World1 assets/Object1 assets/Player 2>/dev/null || true
            git commit -m "Import original MU Lorencia assets" || true
            git push origin HEAD:main
          fi
      - name: Apply exact original MU terrain layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function decodeHeightOZB(bytes){')
          end=s.index('\n}',start)+2
          decoder='\n'.join([
              'function decodeHeightOZB(bytes){',
              ' const off=findSeq(bytes,[0x42,0x4d]);',
              ' if(off<0) throw new Error("TerrainHeight.OZB: BMP interno no encontrado");',
              ' const dv=new DataView(bytes.buffer,bytes.byteOffset+off,bytes.byteLength-off);',
              ' const w=dv.getInt32(18,true),hs=dv.getInt32(22,true),bpp=dv.getUint16(28,true),comp=dv.getUint32(30,true);',
              ' if(w!==256||Math.abs(hs)!==256||bpp!==8||comp!==0) throw new Error("TerrainHeight.OZB no soportado");',
              ' const h=256,stride=256,out=new Uint8Array(256*256),muPixelStart=off+1080;',
              ' // Original MU OpenTerrainHeight reads raw height bytes from Buffer+1080.',
              ' for(let y=0;y<h;y++)out.set(bytes.subarray(muPixelStart+y*stride,muPixelStart+y*stride+w),y*w);',
              ' return {w,h,data:out};',
              '}',
          ])
          s=s[:start]+decoder+s[end:]
          old_idx='inds[k++]=a;inds[k++]=c;inds[k++]=b;inds[k++]=b;inds[k++]=c;inds[k++]=d;'
          new_idx='inds[k++]=a;inds[k++]=d;inds[k++]=b;inds[k++]=a;inds[k++]=c;inds[k++]=d;'
          if old_idx in s:
              s=s.replace(old_idx,new_idx,1)
          hs0=s.index(' const terrainHeightAt=(tx,ty)=>{')
          hs1=s.index('\n };',hs0)+4
          heightfn='\n'.join([
              ' const terrainHeightAt=(tx,ty)=>{',
              '   const x=Math.max(0,Math.min(254.999999,tx)),y=Math.max(0,Math.min(254.999999,ty));',
              '   const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;',
              '   const h00=(height.data[iy*256+ix]||0)*1.5;',
              '   const h10=(height.data[iy*256+ix+1]||0)*1.5;',
              '   const h01=(height.data[(iy+1)*256+ix]||0)*1.5;',
              '   const h11=(height.data[(iy+1)*256+ix+1]||0)*1.5;',
              '   const top=h00+(h10-h00)*fx,bottom=h01+(h11-h01)*fx;',
              '   return top+(bottom-top)*fy+2;',
              ' };',
          ])
          s=s[:hs0]+heightfn+s[hs1:]
          p.write_text(s,encoding='utf-8')
          PY
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const m=s.match(/<script>([\s\S]*?)<\/script>/);
          if(!m) throw new Error('script not found');
          new Function(m[1]);
          console.log('JavaScript syntax OK');
          NODE
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Match original MU TerrainHeight 1080-byte layout"
            git push origin HEAD:main
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
