name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import original MU assets once
        shell: bash
        run: |
          set -euo pipefail
          NEED_WORLD=0
          NEED_OBJECT1=0
          NEED_PLAYER=0
          [ -f "assets/World1/TerrainHeight.OZB" ] && [ -f "assets/World1/Terrain.obj" ] || NEED_WORLD=1
          [ -f "assets/Object1/Tree01.bmd" ] && [ -f "assets/Object1/House01.bmd" ] || NEED_OBJECT1=1
          [ -f "assets/Player/player.bmd" ] || NEED_PLAYER=1
          if [ "$NEED_WORLD" = 1 ] || [ "$NEED_OBJECT1" = 1 ] || [ "$NEED_PLAYER" = 1 ]; then
            echo "Importing original MU Season 6 assets..."
            curl --fail --location --retry 3 \
              "https://github.com/jf2nshb2tk-dev/reino-de-ceniza/releases/download/Mu-client-s6/ClientS6.Base.rar" \
              -o /tmp/ClientS6.Base.rar
            sudo apt-get update -qq
            sudo apt-get install -y unar
            rm -rf /tmp/mu
            mkdir -p /tmp/mu
            unar -q -o /tmp/mu /tmp/ClientS6.Base.rar
            mkdir -p assets
            if [ "$NEED_WORLD" = 1 ]; then
              rm -rf assets/World1
              cp -R "/tmp/mu/ClientS6 Base/Data/World1" assets/World1
            fi
            if [ "$NEED_OBJECT1" = 1 ]; then
              rm -rf assets/Object1
              cp -R "/tmp/mu/ClientS6 Base/Data/Object1" assets/Object1
            fi
            if [ "$NEED_PLAYER" = 1 ]; then
              rm -rf assets/Player
              cp -R "/tmp/mu/ClientS6 Base/Data/Player" assets/Player
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/World1 assets/Object1 assets/Player 2>/dev/null || true
            git commit -m "Import original Lorencia Object1 assets" || true
            git push origin HEAD:main
          fi
      - name: Generate Player BMD diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path

          KEY=[0xD1,0x73,0x52,0xF6,0xD2,0x9A,0xCB,0x27,0x3E,0xAF,0x59,0x31,0x37,0xB3,0xE7,0xA2]
          def dec(src):
              out=bytearray(len(src)); mk=0x5E
              for i,b in enumerate(src):
                  out[i]=((b ^ KEY[i & 15]) - mk) & 255
                  mk=(b+0x3D)&255
              return bytes(out)
          def s32(b,o): return b[o:o+32].split(b'\\0',1)[0].decode('latin1','replace')
          def parse(path):
              raw=Path(path).read_bytes(); ver=raw[3]
              if raw[:3] != b'BMD': raise ValueError('bad BMD')
              if ver==12:
                  n=struct.unpack_from('<i',raw,4)[0]
                  raw=raw[:4]+dec(raw[8:8+n])
              p=4; name=s32(raw,p); p+=32
              mc,bc,ac=struct.unpack_from('<HHH',raw,p); p+=6
              meshes=[]
              for mi in range(mc):
                  nv,nn,nt,ntr,tex=struct.unpack_from('<hhhhh',raw,p); p+=10
                  p+=nv*16+nn*20+nt*8+ntr*64
                  texture=s32(raw,p); p+=32
                  meshes.append(dict(index=mi,vertices=nv,normals=nn,uvs=nt,triangles=ntr,texture=texture,textureIndex=tex))
              actions=[]
              for ai in range(ac):
                  nk=struct.unpack_from('<h',raw,p)[0]; p+=2
                  lock=raw[p]!=0; p+=1
                  if lock: p+=nk*12
                  actions.append(dict(index=ai,keys=nk,lock=lock))
              bones=[]
              for bi in range(bc):
                  dummy=raw[p]!=0; p+=1
                  if dummy:
                      bones.append(dict(index=bi,dummy=True,parent=-1,name=''))
                      continue
                  bn=s32(raw,p); p+=32
                  parent=struct.unpack_from('<h',raw,p)[0]; p+=2
                  action0=None
                  for ai,a in enumerate(actions):
                      nk=a['keys']
                      if ai==0 and nk:
                          pos=struct.unpack_from('<fff',raw,p)
                      p+=nk*12
                      if ai==0 and nk:
                          rot=struct.unpack_from('<fff',raw,p)
                          action0=dict(pos=pos,rot=rot)
                      p+=nk*12
                  bones.append(dict(index=bi,dummy=False,parent=parent,name=bn,action0=action0))
              return dict(file=str(path),version=ver,name=name,meshCount=mc,boneCount=bc,actionCount=ac,meshes=meshes,actions=actions[:12],bones=bones)

          files=['player.bmd','HelmClass01.bmd','ArmorClass01.bmd','PantClass01.bmd','GloveClass01.bmd','BootClass01.bmd']
          out={}
          for fn in files:
              out[fn]=parse(Path('assets/Player')/fn)
          Path('player-debug.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
