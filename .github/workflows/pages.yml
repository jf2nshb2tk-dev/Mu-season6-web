name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import original MU assets once
        shell: bash
        run: |
          set -euo pipefail
          NEED_WORLD=0
          NEED_OBJECT1=0
          NEED_PLAYER=0
          [ -f "assets/World1/TerrainHeight.OZB" ] && [ -f "assets/World1/Terrain.obj" ] || NEED_WORLD=1
          [ -f "assets/Object1/Tree01.bmd" ] && [ -f "assets/Object1/House01.bmd" ] || NEED_OBJECT1=1
          [ -f "assets/Player/player.bmd" ] || NEED_PLAYER=1
          if [ "$NEED_WORLD" = 1 ] || [ "$NEED_OBJECT1" = 1 ] || [ "$NEED_PLAYER" = 1 ]; then
            echo "Importing original MU Season 6 assets..."
            curl --fail --location --retry 3 \
              "https://github.com/jf2nshb2tk-dev/reino-de-ceniza/releases/download/Mu-client-s6/ClientS6.Base.rar" \
              -o /tmp/ClientS6.Base.rar
            sudo apt-get update -qq
            sudo apt-get install -y unar
            rm -rf /tmp/mu
            mkdir -p /tmp/mu
            unar -q -o /tmp/mu /tmp/ClientS6.Base.rar
            mkdir -p assets
            if [ "$NEED_WORLD" = 1 ]; then
              rm -rf assets/World1
              cp -R "/tmp/mu/ClientS6 Base/Data/World1" assets/World1
            fi
            if [ "$NEED_OBJECT1" = 1 ]; then
              rm -rf assets/Object1
              cp -R "/tmp/mu/ClientS6 Base/Data/Object1" assets/Object1
            fi
            if [ "$NEED_PLAYER" = 1 ]; then
              rm -rf assets/Player
              cp -R "/tmp/mu/ClientS6 Base/Data/Player" assets/Player
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/World1 assets/Object1 assets/Player 2>/dev/null || true
            git commit -m "Import original Lorencia Object1 assets" || true
            git push origin HEAD:main
          fi
      - name: Apply original MU TerrainHeight row order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=''' const h=Math.abs(hs), stride=Math.floor((w*bpp+31)/32)*4, out=new Uint8Array(w*h), bottomUp=hs>0;\n for(let y=0;y<h;y++){const sy=bottomUp?(h-1-y):y;out.set(bytes.subarray(off+px+sy*stride,off+px+sy*stride+w),y*w)}'''
          new=''' const h=Math.abs(hs), stride=Math.floor((w*bpp+31)/32)*4, out=new Uint8Array(w*h);\n // MU does NOT reinterpret TerrainHeight.OZB as a display image. The original\n // client seeks to the 8-bit BMP pixel payload and reads the 65536 height bytes\n // sequentially into TerrainHeight, so keep the file row order exactly as stored.\n for(let y=0;y<h;y++){const sy=y;out.set(bytes.subarray(off+px+sy*stride,off+px+sy*stride+w),y*w)}'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'MU does NOT reinterpret TerrainHeight.OZB as a display image.' not in s:
              raise SystemExit('TerrainHeight row-order anchor not found')
          p.write_text(s,encoding='utf-8')
          print('TerrainHeight uses original MU raw BMP row order')
          PY
      - name: Apply Bridge01 pivot correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='Bridge01: EncTerrain1.obj already contains the authored world anchors.'
          if marker not in s:
              old='   const meshes=parseBmd(await getObjectBytes(model)),idata=new Float32Array(list.length*8);let q=0;'
              new='\n'.join([
                  '   const meshes=parseBmd(await getObjectBytes(model)),idata=new Float32Array(list.length*8);let q=0;',
                  '   // Bridge01: EncTerrain1.obj already contains the authored world anchors.',
                  '   // Cancel the non-zero bind/root translation inside Bridge01.bmd so its',
                  '   // visible geometry rotates around the map anchor instead of an offset pivot.',
                  '   if(model.toLowerCase()==="bridge01.bmd"&&meshes.bones?.[0]?.p){',
                  '     const bp=meshes.bones[0].p;',
                  '     for(const bm of meshes){',
                  '       for(let vi=0;vi<bm.data.length;vi+=8){',
                  '         bm.data[vi]-=bp[0];',
                  '         bm.data[vi+1]-=bp[1];',
                  '         bm.data[vi+2]-=bp[2];',
                  '       }',
                  '     }',
                  '   }',
              ])
              if s.count(old)!=1:
                  raise SystemExit(f'Bridge01 patch anchor count={s.count(old)}')
              s=s.replace(old,new)
              old_status='if(objectsReady&&playerReady)statusEl.textContent="Lorencia · "+objectScene.instances+" objetos · blends MU + Bridge01 corregidos · PJ/cámara OK · ATT";'
              new_status='if(objectsReady&&playerReady)statusEl.textContent="Lorencia · "+objectScene.instances+" objetos · Bridge01 pivot normalizado · PJ/cámara OK · ATT";'
              if s.count(old_status)==1:
                  s=s.replace(old_status,new_status)
              p.write_text(s,encoding='utf-8')
              print('Bridge01 local pivot normalized for deployment')
          else:
              print('Bridge01 pivot correction already present')
          PY
      - name: Apply original MU terrain triangulation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Original MU renders each terrain tile as a triangle fan ordered
          # TL -> TR -> BR -> BL, i.e. the diagonal is TL -> BR.
          old_idx='inds[k++]=a;inds[k++]=c;inds[k++]=b;inds[k++]=b;inds[k++]=c;inds[k++]=d;'
          new_idx='inds[k++]=a;inds[k++]=d;inds[k++]=b;inds[k++]=a;inds[k++]=c;inds[k++]=d;'
          if old_idx in s:
              s=s.replace(old_idx,new_idx,1)
          elif new_idx not in s:
              raise SystemExit('terrain index anchor not found')

          old_h=''' const terrainHeightAt=(tx,ty)=>{\n   const x=Math.max(0,Math.min(255,Math.round(tx))),y=Math.max(0,Math.min(255,Math.round(ty)));\n   return (height.data[y*256+x]||0)*1.5+2;\n };'''
          new_h=''' const terrainHeightAt=(tx,ty)=>{\n   const x=Math.max(0,Math.min(254.999999,tx)),y=Math.max(0,Math.min(254.999999,ty));\n   const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;\n   const h00=(height.data[iy*256+ix]||0)*1.5;\n   const h10=(height.data[iy*256+ix+1]||0)*1.5;\n   const h01=(height.data[(iy+1)*256+ix]||0)*1.5;\n   const h11=(height.data[(iy+1)*256+ix+1]||0)*1.5;\n   // Same TL->BR split used by the original MU terrain triangle fan.\n   const h=fy<=fx\n     ? h00+fx*(h10-h00)+fy*(h11-h10)\n     : h00+fx*(h11-h01)+fy*(h01-h00);\n   return h+2;\n };'''
          if old_h in s:
              s=s.replace(old_h,new_h,1)
          elif 'Same TL->BR split used by the original MU terrain triangle fan.' not in s:
              raise SystemExit('terrainHeightAt anchor not found')

          p.write_text(s,encoding='utf-8')
          print('Terrain diagonal corrected to original MU TL->BR split')
          PY
      - name: Validate JavaScript
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const m=s.match(/<script>([\s\S]*?)<\/script>/);
          if(!m)throw new Error('script not found');
          new Function(m[1]);
          console.log('JavaScript syntax OK');
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
