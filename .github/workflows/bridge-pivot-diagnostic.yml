name: Apply Bridge Pivot Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Bridge01 local pivot
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''   const meshes=parseBmd(await getObjectBytes(model)),idata=new Float32Array(list.length*8);let q=0;'''
          new='''   const meshes=parseBmd(await getObjectBytes(model)),idata=new Float32Array(list.length*8);let q=0;
   // Bridge01 has a non-zero bind/root translation inside the BMD. The .obj positions
   // are already the authored world anchors, so normalize only this model's local pivot
   // before applying the original map position/rotation. Houses and every other Object1
   // model keep the generic MU transform unchanged.
   if(model.toLowerCase()==="bridge01.bmd"&&meshes.bones?.[0]?.p){
     const bp=meshes.bones[0].p;
     for(const bm of meshes){
       for(let vi=0;vi<bm.data.length;vi+=8){
         bm.data[vi]-=bp[0];bm.data[vi+1]-=bp[1];bm.data[vi+2]-=bp[2];
       }
     }
   }'''
          if s.count(old)!=1:
              raise SystemExit(f'bridge anchor count={s.count(old)}')
          s=s.replace(old,new)
          old_status='''if(objectsReady&&playerReady)statusEl.textContent="Lorencia · "+objectScene.instances+" objetos · blends MU + Bridge01 corregidos · PJ/cámara OK · ATT";'''
          new_status='''if(objectsReady&&playerReady)statusEl.textContent="Lorencia · "+objectScene.instances+" objetos · Bridge01 pivot normalizado · PJ/cámara OK · ATT";'''
          if s.count(old_status)!=1:
              raise SystemExit(f'status anchor count={s.count(old_status)}')
          s=s.replace(old_status,new_status)
          p.write_text(s,encoding='utf-8')
          PY
          node - <<'NODE'
          const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);if(!m)throw new Error('script not found');new Function(m[1]);console.log('JavaScript syntax OK');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Normalize Bridge01 local pivot to map anchors"
          git push origin HEAD:main
