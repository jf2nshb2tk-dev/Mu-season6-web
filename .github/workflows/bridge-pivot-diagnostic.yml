name: Bridge Pivot Diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect objects around Lorencia bridge
        shell: bash
        run: |
          python3 - <<'PY'
          import struct, json
          from pathlib import Path
          KEY=[0xD1,0x73,0x52,0xF6,0xD2,0x9A,0xCB,0x27,0x3E,0xAF,0x59,0x31,0x37,0xB3,0xE7,0xA2]
          def dec(src):
              out=bytearray(len(src)); mk=0x5E
              for i,b in enumerate(src):
                  out[i]=((b ^ KEY[i & 15]) - mk) & 255; mk=(b+0x3D)&255
              return bytes(out)
          def model(t):
              p=lambda n:f'{n:02d}'
              if 50<=t<=51:return 'FireLight'+p(t-49)
              if t==52:return 'Bonfire01'
              if t==55:return 'DoungeonGate01'
              if t==80:return 'Bridge01'
              if 81<=t<=84:return 'Fence'+p(t-80)
              if t==85:return 'BridgeStone01'
              if t==90:return 'StreetLight01'
              if t==95:return 'Curtain01'
              if 121<=t<=126:return 'HouseWall'+p(t-120)
              if 127<=t<=129:return 'HouseEtc'+p(t-126)
              if 130<=t<=132:return 'Light'+p(t-129)
              if t==150:return 'Candle01'
              return f'Type{t}'
          b=dec(Path('assets/World1/EncTerrain1.obj').read_bytes()); ver=b[0]; header=struct.unpack_from('<h',b,2)[0]; sz={0:30,1:32,2:33,3:45,4:46,5:54}[ver]; count=min(header,(len(b)-4)//sz)
          zones=[(125,145,142,165),(92,120,112,136),(153,120,173,136)]
          out=[]; p=4
          for i in range(count):
              t=struct.unpack_from('<h',b,p)[0]; x,y,z=struct.unpack_from('<fff',b,p+2); ax,ay,az=struct.unpack_from('<fff',b,p+14); sc=struct.unpack_from('<f',b,p+26)[0]
              tx,ty=x/100,y/100
              if any(a<=tx<=c and bb<=ty<=d for a,bb,c,d in zones):
                  out.append({'i':i,'type':t,'model':model(t),'tile':[round(tx,3),round(ty,3)],'z':round(z,2),'angle':[round(ax,1),round(ay,1),round(az,1)],'scale':round(sc,3)})
              p+=sz
          print('BRIDGE_NEARBY='+json.dumps(out,separators=(',',':')))
          PY
