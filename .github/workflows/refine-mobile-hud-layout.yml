name: Refine Mobile MU HUD
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-mobile-hud-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine phone-only HUD layout
        run: python3 scripts/refine_mobile_hud_layout.py
      - name: Validate refined mobile HUD
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const m=s.match(/<script>([\s\S]*?)<\/script>/);
          if(!m) throw new Error('script not found');
          new Function(m[1]);
          for(const q of [
            'joyCx=innerWidth*.11','joyCy=innerHeight*.78','const joySize=Math.round(72*scale)',
            'width:100vw!important','if(expTrack.parentNode!==document.body)document.body.appendChild(expTrack)',
            'padding:4px 5px 4px;border:1px solid #756541;border-radius:12px',
            'muExpFill.style.width=isPhoneMuHud()?(ep*100)+"%"'
          ]) if(!s.includes(q)) throw new Error('missing '+q);
          console.log('Refined phone HUD JS/CSS OK');
          NODE
      - name: Commit refined mobile HUD
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine mobile HUD joystick EXP rail and menu bar'
          git push origin HEAD:main
