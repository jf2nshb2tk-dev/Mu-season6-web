name: Tune MU HUD Mobile
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-hud-inventory.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tune HUD for landscape mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='bottom:max(0px,env(safe-area-inset-bottom));width:640px;height:51px;'
          new='bottom:0;width:640px;height:51px;'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('HUD bottom rule not found')
          old_scale='const scale=Math.max(.66,Math.min(1.5,innerWidth/640));'
          new_scale='const scale=Math.max(.62,Math.min(1.35,innerWidth/700));'
          if old_scale in s:
              s=s.replace(old_scale,new_scale,1)
          elif new_scale not in s:
              raise SystemExit('HUD scale rule not found')
          old_pos='muHud.style.setProperty("--mu-ui-scale",scale);muHud.style.transform="scale("+scale+")";muHud.style.left=((innerWidth-640*scale)/2)+"px";'
          new_pos=old_pos+'muHudInfo.style.bottom=Math.ceil(51*scale+2)+"px";'
          if old_pos in s and 'muHudInfo.style.bottom=Math.ceil(51*scale+2)+"px";' not in s:
              s=s.replace(old_pos,new_pos,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate HUD tuning
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const m=s.match(/<script>([\s\S]*?)<\/script>/);
          if(!m) throw new Error('script not found');
          new Function(m[1]);
          if(!s.includes('#muHud{display:none;position:fixed;z-index:8;left:0;bottom:0;')) throw new Error('HUD is not flush with bottom');
          if(!s.includes('Math.min(1.35,innerWidth/700)')) throw new Error('HUD mobile scale not applied');
          if(!s.includes('muHudInfo.style.bottom=Math.ceil(51*scale+2)+"px"')) throw new Error('HUD info alignment not applied');
          console.log('Mobile HUD size and bottom alignment OK');
          NODE
      - name: Commit tuned HUD
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes'; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Season 6 HUD smaller and flush to bottom"
          git push origin HEAD:main
