name: Bridge render fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch original Bridge01 hidden mesh rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='if(!m.data.length||/shadow/i.test(m.texture))continue;const vao=gl.createVertexArray();'
          new='if(!m.data.length||/shadow/i.test(m.texture)||(model.toLowerCase()==="bridge01.bmd"&&m.meshIndex===1))continue;const vao=gl.createVertexArray();'
          if old not in s:
              raise SystemExit('Bridge patch anchor not found')
          s=s.replace(old,new,1)
          s=s.replace('blends MU corregidos · PJ/cámara OK · ATT','blends MU + Bridge01 corregidos · PJ/cámara OK · ATT')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Hide Bridge01 mesh omitted by original MU client"
          git push
