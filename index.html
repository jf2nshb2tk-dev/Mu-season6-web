 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);gl.generateMipmap(gl.TEXTURE_2D);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);return t;
}
const objTexCache=new Map();
async function objectTexture(path){
 const f=path.split(String.fromCharCode(92)).join("/").split("/").pop(),dot=f.lastIndexOf("."),base=dot<0?f:f.slice(0,dot),ext=(dot<0?"":f.slice(dot+1)).toLowerCase(),asset=base+(ext==="tga"?".OZT":".OZJ"),key=asset.toLowerCase();
 if(objTexCache.has(key))return objTexCache.get(key);
 const promise=(async()=>{try{const bytes=await getObjectBytes(asset),c=asset.toLowerCase().endsWith(".ozt")?objectOzt(bytes):await objectOzj(bytes);return repeatTex(c)}catch(e){console.warn("Texture",asset,e);const c=document.createElement("canvas");c.width=c.height=2;const x=c.getContext("2d");x.fillStyle="#8c887c";x.fillRect(0,0,2,2);return repeatTex(c)}})();objTexCache.set(key,promise);return promise;
}
const OBJ_VS=`#version 300 es
precision highp float;
layout(location=0)in vec3 aPos;layout(location=1)in vec3 aN;layout(location=2)in vec2 aUV;layout(location=3)in vec4 iPS;layout(location=4)in vec4 iQ;
uniform mat4 uVP;out vec2 vUV;out vec3 vN;
vec3 qr(vec4 q,vec3 v){return v+2.0*cross(q.xyz,cross(q.xyz,v)+q.w*v);}
void main(){vec3 p=qr(iQ,aPos*iPS.w)+iPS.xyz,n=qr(iQ,aN);vec3 w=vec3((p.x-12750.0)*0.025,p.z*0.025,(p.y-12750.0)*0.025);vN=normalize(vec3(n.x,n.z,n.y));vUV=aUV;gl_Position=uVP*vec4(w,1.0);}
`;
const OBJ_FS=`#version 300 es
precision highp float;in vec2 vUV;in vec3 vN;uniform sampler2D uObjTex;out vec4 o;
void main(){vec4 c=texture(uObjTex,vUV);if(c.a<.16)discard;float d=max(dot(normalize(vN),normalize(vec3(.45,.85,.25))),0.0);o=vec4(c.rgb*(.50+.62*d),c.a);}
`;
const objProg=program(OBJ_VS,OBJ_FS),objVP=gl.getUniformLocation(objProg,"uVP"),objSampler=gl.getUniformLocation(objProg,"uObjTex");
async function buildLorenciaObjects(){
 const parsed=parseMuObj(await getBytes("EncTerrain1.obj")),renders=[],entries=[...parsed.groups.entries()];let done=0,failed=0,instances=0;
 for(const [model,list] of entries){
  try{
   statusEl.textContent="Objetos Lorencia "+done+"/"+entries.length+" · "+model;
   const meshes=parseBmd(await getObjectBytes(model)),idata=new Float32Array(list.length*8);let q=0;
   for(const x of list){idata[q++]=x.pos[0];idata[q++]=x.pos[1];idata[q++]=x.pos[2];idata[q++]=x.scale;idata[q++]=x.q[0];idata[q++]=x.q[1];idata[q++]=x.q[2];idata[q++]=x.q[3]}
   const inst=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,inst);gl.bufferData(gl.ARRAY_BUFFER,idata,gl.STATIC_DRAW);
   for(const m of meshes){
    if(!m.data.length||/shadow/i.test(m.texture))continue;const vao=gl.createVertexArray();gl.bindVertexArray(vao);const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,m.data,gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,32,0);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,32,12);gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,2,gl.FLOAT,false,32,24);
    gl.bindBuffer(gl.ARRAY_BUFFER,inst);gl.enableVertexAttribArray(3);gl.vertexAttribPointer(3,4,gl.FLOAT,false,32,0);gl.vertexAttribDivisor(3,1);gl.enableVertexAttribArray(4);gl.vertexAttribPointer(4,4,gl.FLOAT,false,32,16);gl.vertexAttribDivisor(4,1);
    renders.push({vao,count:m.data.length/8,n:list.length,tex:await objectTexture(m.texture)});
   }
   instances+=list.length;
  }catch(e){failed++;console.warn("Modelo omitido",model,e)}
  done++;await new Promise(r=>setTimeout(r,0));
 }
 return{renders,instances,failed};
}

async function main(){
 if(!gl)return;
 statusEl.textContent="Cargando Terrain.map + 14 texturas originales…";
 const [hb,mb,lb,...tileBytes]=await Promise.all([
   getBytes("TerrainHeight.OZB"),getBytes("Terrain.map"),getBytes("TerrainLight.OZJ"),...TILE_FILES.map(getBytes)
 ]);
 const height=decodeHeightOZB(hb), mapping=parseTerrainMap(mb);

 statusEl.textContent="Armando atlas de texturas MU…";
 const atlas=document.createElement("canvas");atlas.width=1024;atlas.height=1024;const ax=atlas.getContext("2d");
 for(let i=0;i<tileBytes.length;i++){
   const tc=await ozjToCanvas(tileBytes[i],256);
   ax.drawImage(tc,(i%4)*256,Math.floor(i/4)*256);
 }
 const lightCanvas=await ozjToCanvas(lb,256);

 const N=255,cellScale=2.5,heightScale=.0375;
 const verts=new Float32Array((N+1)*(N+1)*5);
 const inds=new Uint32Array(N*N*6);
 let k=0;
 for(let z=0;z<=N;z++)for(let x=0;x<=N;x++){
   const hv=height.data[z*256+x]*heightScale;
   verts[k++]=(x-N/2)*cellScale;verts[k++]=hv;verts[k++]=(z-N/2)*cellScale;verts[k++]=x/N;verts[k++]=z/N;
 }
 k=0;
 for(let z=0;z<N;z++)for(let x=0;x<N;x++){
   const a=z*(N+1)+x,b=a+1,c=a+(N+1),d=c+1;
   inds[k++]=a;inds[k++]=c;inds[k++]=b;inds[k++]=b;inds[k++]=c;inds[k++]=d;
 }

 const vao=gl.createVertexArray();gl.bindVertexArray(vao);
 const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,verts,gl.STATIC_DRAW);
 gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,20,0);
 gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,2,gl.FLOAT,false,20,12);
 const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,inds,gl.STATIC_DRAW);

 const atlasTex=canvasTex(atlas), lightTex=canvasTex(lightCanvas);
 const l1Tex=byteTex(mapping.layer1),l2Tex=byteTex(mapping.layer2),alphaTex=byteTex(mapping.alpha);
 gl.useProgram(prog);
 [["uAtlas",atlasTex],["uLayer1",l1Tex],["uLayer2",l2Tex],["uAlpha",alphaTex],["uLight",lightTex]].forEach(([n,t],i)=>{
   gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform1i(gl.getUniformLocation(prog,n),i);
 });
 gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);
 statusEl.textContent="Terreno real listo · cargando árboles y edificios…";
 let objectScene={renders:[],instances:0,failed:0};
 buildLorenciaObjects().then(x=>{objectScene=x;statusEl.textContent="Lorencia · "+x.instances+" objetos originales"+(x.failed?" · "+x.failed+" modelos omitidos":"");}).catch(e=>{console.warn(e);statusEl.textContent="Terreno listo · error cargando objetos";});

 let yaw=-.72,pitch=.58,dist=145,targetX=26,targetY=6,targetZ=-9,drag=false,lastX=0,lastY=0,pinch=0,lastT=performance.now(),frames=0;
 function resize(){
   const d=Math.min(devicePixelRatio||1,1.45),w=Math.max(1,Math.floor(innerWidth*d)),h=Math.max(1,Math.floor(innerHeight*d));
   if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}
 }
 function frame(t){
   resize();
   const cp=Math.cos(pitch),sp=Math.sin(pitch),eye=[Math.cos(yaw)*cp*dist,sp*dist+targetY,Math.sin(yaw)*cp*dist];
   gl.useProgram(prog);gl.uniformMatrix4fv(uMVP,false,mul(perspective(.68,canvas.width/canvas.height,.1,1800),lookAt(eye,[0,targetY,0],[0,1,0])));gl.uniform1f(uTime,t/1000);
   gl.clearColor(.012,.015,.018,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
   gl.bindVertexArray(vao);gl.drawElements(gl.TRIANGLES,inds.length,gl.UNSIGNED_INT,0);
   frames++;if(t-lastT>750){fpsEl.textContent=Math.round(frames*1000/(t-lastT))+" FPS · 14 tiles MU · Terrain.map real";frames=0;lastT=t}
   requestAnimationFrame(frame);
 }
 canvas.addEventListener("pointerdown",e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
 canvas.addEventListener("pointermove",e=>{if(!drag)return;yaw+=(e.clientX-lastX)*.0055;pitch=Math.max(.28,Math.min(1.28,pitch+(e.clientY-lastY)*.0045));lastX=e.clientX;lastY=e.clientY});
 canvas.addEventListener("pointerup",()=>drag=false);canvas.addEventListener("pointercancel",()=>drag=false);
 canvas.addEventListener("wheel",e=>{e.preventDefault();dist=Math.max(45,Math.min(800,dist+e.deltaY*.22))},{passive:false});
 canvas.addEventListener("touchstart",e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});
 canvas.addEventListener("touchmove",e=>{if(e.touches.length===2){e.preventDefault();const q=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)dist=Math.max(45,Math.min(800,dist+(pinch-q)*.5));pinch=q}},{passive:false});
 canvas.addEventListener("touchend",()=>pinch=0,{passive:true});
 requestAnimationFrame(frame);
}
main().catch(fail);
</script>
