function findSeq(a,seq,start=0){

const VS=`#version 300 es
precision highp float;

const FS=`#version 300 es
precision highp float;

function parsePlayerRig(raw){

 gl.useProgram(prog);
 [["uAtlas",atlasTex],["uLayer1",l1Tex],["uLayer2",l2Tex],["uAlpha",alphaTex],["uLight",lightTex]].forEach(([n,t],i)=>{
   gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform1i(gl.getUniformLocation(prog,n),i);
 });
 gl.uniform2fv(gl.getUniformLocation(prog,"uTileScale[0]"),tileScales);
 gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);
 statusEl.textContent="Terreno real listo · cargando árboles y edificios…";
 let objectScene={renders:[],instances:0,failed:0},playerScene={renders:[],parts:0,meshes:0,tile:[138,124]},objectsReady=false,playerReady=false;
 const refreshStatus=()=>{
   if(objectsReady&&playerReady)statusEl.textContent="Lorencia · "+objectScene.instances+" objetos · blends MU + Bridge01 corregidos · PJ/cámara OK · ATT";
   else if(objectsReady)statusEl.textContent="Lorencia lista · cargando personaje original…";
   else if(playerReady)statusEl.textContent="Dark Wizard original listo · cargando objetos de Lorencia…";
 };
 buildLorenciaObjects().then(x=>{objectScene=x;objectsReady=true;refreshStatus();}).catch(e=>{console.warn(e);statusEl.textContent="Terreno listo · error cargando objetos";});
 buildPlayer(height).then(x=>{playerScene=x;playerReady=true;resetCameraToPlayer();refreshStatus();}).catch(e=>{console.warn("Player",e);statusEl.textContent="Lorencia lista · error cargando personaje";});

 let targetX=26.25,targetY=2.8,targetZ=-8.75;
 // MU-style gameplay view tuned from the in-game reference: right-shoulder/isometric side.
 // Keep this world-space yaw fixed while the player moves so the map reads like classic MU.
 const MU_CAM_YAW=.91,MU_CAM_PITCH=.771,MU_CAM_DIST=20.5;
 let playerCamYaw=MU_CAM_YAW,playerCamPitch=MU_CAM_PITCH,playerCamDist=MU_CAM_DIST;
 const startCp=Math.cos(playerCamPitch);
 let camX=targetX+Math.cos(playerCamYaw)*startCp*playerCamDist;
 let camY=targetY+Math.sin(playerCamPitch)*playerCamDist;
 let camZ=targetZ+Math.sin(playerCamYaw)*startCp*playerCamDist;
 let camYaw=playerCamYaw+Math.PI,camPitch=-playerCamPitch,camSpeedMul=1;
 let lookDrag=false,lookPointer=-1,lastX=0,lastY=0,lastT=performance.now(),frames=0,lastFrameT=performance.now();
 let joyX=0,joyY=0,joyPointer=-1,verticalMove=0,controlModeName="player";
 const keys=new Set();
 const ATT_SAFE=0x01,ATT_NOMOVE=0x04,ATT_NOGROUND=0x08;

 function cameraForward(){
   const cp=Math.cos(camPitch);
   return [Math.cos(camYaw)*cp,Math.sin(camPitch),Math.sin(camYaw)*cp];
 }
 function playerWorldTarget(){
   if(playerReady&&playerScene.tilePos){
     return[
       (playerScene.tilePos[0]*100-MU_CENTER)*MU_SF,
       terrainHeightAt(playerScene.tilePos[0],playerScene.tilePos[1])*MU_SF+2.8,
       (playerScene.tilePos[1]*100-MU_CENTER)*MU_SF
     ];
   }
   return[targetX,targetY,targetZ];
 }
 function updatePlayerFollowCamera(dt,snap=false){
   const p=playerWorldTarget(),cp=Math.cos(playerCamPitch);
   const dx=Math.cos(playerCamYaw)*cp*playerCamDist;
   const dy=Math.sin(playerCamPitch)*playerCamDist;
   const dz=Math.sin(playerCamYaw)*cp*playerCamDist;
   const desiredX=p[0]+dx,desiredY=p[1]+dy,desiredZ=p[2]+dz;
   const a=snap?1:(1-Math.exp(-dt*11));
   targetX+= (p[0]-targetX)*a;targetY+=(p[1]-targetY)*a;targetZ+=(p[2]-targetZ)*a;
   camX+=(desiredX-camX)*a;camY+=(desiredY-camY)*a;camZ+=(desiredZ-camZ)*a;
   camYaw=playerCamYaw+Math.PI;camPitch=-playerCamPitch;
 }
 function resetCameraToPlayer(){
   playerCamYaw=MU_CAM_YAW;playerCamPitch=MU_CAM_PITCH;playerCamDist=MU_CAM_DIST;
   const p=playerWorldTarget();targetX=p[0];targetY=p[1];targetZ=p[2];
   const cp=Math.cos(playerCamPitch);
   camX=targetX+Math.cos(playerCamYaw)*cp*playerCamDist;
   camY=targetY+Math.sin(playerCamPitch)*playerCamDist;
   camZ=targetZ+Math.sin(playerCamYaw)*cp*playerCamDist;
   camYaw=playerCamYaw+Math.PI;camPitch=-playerCamPitch;
 }
 function resize(){
   const d=Math.min(devicePixelRatio||1,1.45),w=Math.max(1,Math.floor(innerWidth*d)),h=Math.max(1,Math.floor(innerHeight*d));
   if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}
 }
 function updatePlayerAnimation(dt){
   if(!playerReady||!playerScene.rig)return;
   const amount=playerScene.moveAmount||0;
   const nextAction=amount<.08?1:(amount>.72?25:15);
   const nextName=nextAction===1?"IDLE":nextAction===15?"WALK":"RUN";
   if(playerScene.animAction!==nextAction){playerScene.animAction=nextAction;playerScene.animTime=0;playerScene.animName=nextName}
   const playSpeed=nextAction===1?.28:nextAction===15?.38:.34;
   playerScene.animTime+=dt*playSpeed*25;
   const bones=samplePlayerRig(playerScene.rig,nextAction,playerScene.animTime).bones;
   for(const r of playerScene.renders){
     r.skinData=skinRawMesh(r.raw,bones,r.skinData);
     gl.bindBuffer(gl.ARRAY_BUFFER,r.vb);
     gl.bufferSubData(gl.ARRAY_BUFFER,0,r.skinData);
   }
 }
 function updatePlayerMovement(dt){
   if(!playerReady||!playerScene.instanceBuffer||!playerScene.instanceData)return;
   let moveX=joyX,moveY=-joyY;
   if(keys.has("KeyA")||keys.has("ArrowLeft"))moveX-=1;
   if(keys.has("KeyD")||keys.has("ArrowRight"))moveX+=1;
   if(keys.has("KeyW")||keys.has("ArrowUp"))moveY+=1;
   if(keys.has("KeyS")||keys.has("ArrowDown"))moveY-=1;
   let ml=Math.hypot(moveX,moveY),amount=Math.min(1,ml);
   playerScene.moveAmount=0;
   if(ml<.08)return;
   if(ml>1){moveX/=ml;moveY/=ml;ml=1}
   // Movement is camera-relative so mobile controls remain intuitive.
   const flatYaw=camYaw,fx=Math.cos(flatYaw),fy=Math.sin(flatYaw),rx=-fy,ry=fx;
   const dx=fx*moveY+rx*moveX,dy=fy*moveY+ry*moveX;
   const speedTiles=amount>.72?5.2:2.9;
   const oldX=playerScene.tilePos[0],oldY=playerScene.tilePos[1];
   let nx=oldX+dx*speedTiles*dt,ny=oldY+dy*speedTiles*dt;
   nx=Math.max(1,Math.min(254,nx));ny=Math.max(1,Math.min(254,ny));
   const flags=terrainFlagsAt(nx,ny);
   if(flags&(ATT_NOMOVE|ATT_NOGROUND))return;
   playerScene.moveAmount=amount;
   playerScene.tilePos[0]=nx;playerScene.tilePos[1]=ny;
   // MU visual facing is rotated +90° from the raw map movement vector.
   const a=Math.atan2(dy,dx)+Math.PI*.5,q=quatEuler([0,0,a]),data=playerScene.instanceData;
   data[0]=nx*100;data[1]=ny*100;data[2]=terrainHeightAt(nx,ny);data[3]=.85;
   data[4]=q[0];data[5]=q[1];data[6]=q[2];data[7]=q[3];
   gl.bindBuffer(gl.ARRAY_BUFFER,playerScene.instanceBuffer);
   gl.bufferSubData(gl.ARRAY_BUFFER,0,data);
   playerScene.facing=a;
 }
 function updateFreeCamera(dt){
   if(controlModeName==="player"){
     updatePlayerMovement(dt);
     updatePlayerFollowCamera(dt,false);
     return;
   }
   const f=cameraForward(),flatLen=Math.hypot(f[0],f[2])||1;
   const fx=f[0]/flatLen,fz=f[2]/flatLen,rx=-fz,rz=fx;
   let moveX=joyX,moveY=-joyY;
   if(keys.has("KeyA")||keys.has("ArrowLeft"))moveX-=1;
   if(keys.has("KeyD")||keys.has("ArrowRight"))moveX+=1;
   if(keys.has("KeyW")||keys.has("ArrowUp"))moveY+=1;
   if(keys.has("KeyS")||keys.has("ArrowDown"))moveY-=1;
   const ml=Math.hypot(moveX,moveY);if(ml>1){moveX/=ml;moveY/=ml}
   let up=verticalMove;
   if(keys.has("KeyE")||keys.has("Space"))up+=1;
   if(keys.has("KeyQ")||keys.has("ShiftLeft"))up-=1;
   const baseSpeed=22*camSpeedMul,ds=baseSpeed*dt;
   camX+=(fx*moveY+rx*moveX)*ds;
   camZ+=(fz*moveY+rz*moveX)*ds;
   camY+=up*ds*.75;
   camX=Math.max(-380,Math.min(380,camX));
   camZ=Math.max(-380,Math.min(380,camZ));
   camY=Math.max(.5,Math.min(160,camY));
 }
 function frame(t){
   resize();
   const dt=Math.min(.05,(t-lastFrameT)/1000||0);lastFrameT=t;
   if(playerReady&&controlModeName!=="player")playerScene.moveAmount=0;
   updateFreeCamera(dt);
   updatePlayerAnimation(dt);
   const f=cameraForward(),eye=[camX,camY,camZ];
   const look=controlModeName==="player"?[targetX,targetY,targetZ]:[camX+f[0],camY+f[1],camZ+f[2]];
   const vp=mul(perspective(.72,canvas.width/canvas.height,.1,1800),lookAt(eye,look,[0,1,0]));
   gl.useProgram(prog);gl.uniformMatrix4fv(uMVP,false,vp);gl.uniform1f(uTime,t/1000);
   // Object rendering uses texture unit 0. Rebind every terrain texture each frame
   // so the terrain does not start sampling the last loaded Object1 texture.
   const terrainTex=[atlasTex,l1Tex,l2Tex,alphaTex,lightTex];
   for(let i=0;i<terrainTex.length;i++){gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,terrainTex[i]);}
   gl.disable(gl.BLEND);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);
   gl.clearColor(.012,.015,.018,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
   gl.bindVertexArray(vao);gl.drawElements(gl.TRIANGLES,inds.length,gl.UNSIGNED_INT,0);

   if(objectScene.renders.length){
     gl.useProgram(objProg);gl.uniformMatrix4fv(objVP,false,vp);gl.uniform1i(objSampler,0);
     gl.disable(gl.CULL_FACE);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
     gl.activeTexture(gl.TEXTURE0);
     gl.uniform1i(objBlackKey,1);
     let additiveMode=false;
     for(const r of objectScene.renders){
       if(!!r.additive!==additiveMode){
         additiveMode=!!r.additive;
         if(additiveMode){
           // MU/XNA additive meshes: black contributes nothing, so glow/light planes do not appear as black quads.
           gl.uniform1i(objBlackKey,0);
           gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
           gl.depthMask(false);
         }else{
           gl.uniform1i(objBlackKey,1);
           gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
           gl.depthMask(true);
         }
       }
       gl.bindTexture(gl.TEXTURE_2D,r.tex);gl.bindVertexArray(r.vao);
       gl.drawArraysInstanced(gl.TRIANGLES,0,r.count,r.n);
     }
     gl.depthMask(true);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
     // Player textures contain legitimate near-black clothing; never treat black as transparency.
     gl.uniform1i(objBlackKey,0);
     for(const r of playerScene.renders){
       gl.bindTexture(gl.TEXTURE_2D,r.tex);gl.bindVertexArray(r.vao);
       gl.drawArraysInstanced(gl.TRIANGLES,0,r.count,r.n);
     }
     gl.disable(gl.BLEND);gl.enable(gl.CULL_FACE);
   } else if(playerScene.renders.length){
     gl.useProgram(objProg);gl.uniformMatrix4fv(objVP,false,vp);gl.uniform1i(objSampler,0);gl.uniform1i(objBlackKey,0);gl.disable(gl.CULL_FACE);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.activeTexture(gl.TEXTURE0);
     for(const r of playerScene.renders){gl.bindTexture(gl.TEXTURE_2D,r.tex);gl.bindVertexArray(r.vao);gl.drawArraysInstanced(gl.TRIANGLES,0,r.count,r.n)}
     gl.disable(gl.BLEND);gl.enable(gl.CULL_FACE);
   }

   frames++;if(t-lastT>750){
     let cellInfo="";
     if(playerReady&&playerScene.tilePos){
       const tx=Math.floor(playerScene.tilePos[0]),ty=Math.floor(playerScene.tilePos[1]),fl=terrainFlagsAt(tx,ty);
       cellInfo=" · "+tx+","+ty+(fl&ATT_SAFE?" SAFE":"")+(fl&ATT_NOMOVE?" BLOQ":"");
     }
     const animInfo=playerReady&&playerScene.animName?" · "+playerScene.animName:"";
     fpsEl.textContent=Math.round(frames*1000/(t-lastT))+" FPS · "+objectScene.instances+" objetos · "+(controlModeName==="player"?"MODO PJ":"CAM LIBRE")+" x"+camSpeedMul+animInfo+cellInfo;
     frames=0;lastT=t
   }
   requestAnimationFrame(frame);
 }

 // Free look: drag anywhere outside the on-screen controls.
 canvas.addEventListener("pointerdown",e=>{
   lookDrag=true;lookPointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId);
 });
 canvas.addEventListener("pointermove",e=>{
   if(!lookDrag||e.pointerId!==lookPointer)return;
   const dx=e.clientX-lastX,dy=e.clientY-lastY;
   if(controlModeName==="player"){
     playerCamYaw+=dx*.0052;
     playerCamPitch=Math.max(.35,Math.min(1.05,playerCamPitch+dy*.0042));
     updatePlayerFollowCamera(0,true);
   }else{
     camYaw+=dx*.0052;
     camPitch=Math.max(-1.42,Math.min(1.42,camPitch-dy*.0046));
   }
   lastX=e.clientX;lastY=e.clientY;
 });
 const stopLook=e=>{if(e.pointerId===lookPointer){lookDrag=false;lookPointer=-1}};
 canvas.addEventListener("pointerup",stopLook);canvas.addEventListener("pointercancel",stopLook);

 // Mobile movement joystick.
 function updateJoy(e){
   const r=joyBase.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
   let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.34,l=Math.hypot(dx,dy);
   if(l>max){dx=dx/l*max;dy=dy/l*max}
   joyX=dx/max;joyY=dy/max;
   joyKnob.style.transform="translate("+dx+"px,"+dy+"px)";
 }
 function stopJoy(e){
   if(e.pointerId!==joyPointer)return;
   joyPointer=-1;joyX=0;joyY=0;joyKnob.style.transform="translate(0px,0px)";
 }
 joyBase.addEventListener("pointerdown",e=>{e.preventDefault();joyPointer=e.pointerId;joyBase.setPointerCapture(e.pointerId);updateJoy(e)});
 joyBase.addEventListener("pointermove",e=>{if(e.pointerId===joyPointer){e.preventDefault();updateJoy(e)}});
 joyBase.addEventListener("pointerup",stopJoy);joyBase.addEventListener("pointercancel",stopJoy);

 function holdButton(el,value){
   const on=e=>{e.preventDefault();if(controlModeName!=="camera")return;verticalMove=value;el.setPointerCapture?.(e.pointerId)};
   const off=e=>{e.preventDefault();verticalMove=0};
   el.addEventListener("pointerdown",on);el.addEventListener("pointerup",off);el.addEventListener("pointercancel",off);el.addEventListener("pointerleave",e=>{if(e.buttons===0)verticalMove=0});
 }
 holdButton(camUp,1);holdButton(camDown,-1);
 camHome.addEventListener("click",e=>{
   e.preventDefault();
   controlModeName="player";controlMode.textContent="MODO PJ";
   $("#hint").textContent="MODO PJ · Joystick: mover personaje · Cámara MU siguiendo";
   resetCameraToPlayer();
 });
 controlMode.addEventListener("click",e=>{
   e.preventDefault();
   controlModeName=controlModeName==="camera"?"player":"camera";
   controlMode.textContent=controlModeName==="player"?"MODO PJ":"MODO CAM";
   if(controlModeName==="player"){
     resetCameraToPlayer();
     $("#hint").textContent="MODO PJ · Joystick: mover personaje · Cámara MU siguiendo";
   }else{
     $("#hint").textContent="CÁMARA LIBRE · Joystick: mover · Arrastre: mirar";
   }
 });
 camSpeed.addEventListener("click",e=>{
   e.preventDefault();
   camSpeedMul=camSpeedMul===1?3:camSpeedMul===3?6:1;
   camSpeed.textContent="VELOCIDAD x"+camSpeedMul;
 });

 window.addEventListener("keydown",e=>{keys.add(e.code);if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault()},{passive:false});
 window.addEventListener("keyup",e=>keys.delete(e.code));
 let followPinch=0;
 canvas.addEventListener("touchstart",e=>{
   if(controlModeName==="player"&&e.touches.length===2)followPinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
 },{passive:true});
 canvas.addEventListener("touchmove",e=>{
   if(controlModeName==="player"&&e.touches.length===2){
     e.preventDefault();
     const q=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
     if(followPinch)playerCamDist=Math.max(10,Math.min(38,playerCamDist+(followPinch-q)*.035));
     followPinch=q;updatePlayerFollowCamera(0,true);
   }
 },{passive:false});
 canvas.addEventListener("touchend",()=>followPinch=0,{passive:true});
 canvas.addEventListener("wheel",e=>{
   e.preventDefault();
   if(controlModeName==="player"){
     playerCamDist=Math.max(10,Math.min(38,playerCamDist+e.deltaY*.02));
     updatePlayerFollowCamera(0,true);
     return;
   }
   const f=cameraForward(),step=Math.sign(e.deltaY)*-4*camSpeedMul;
   camX+=f[0]*step;camY+=f[1]*step;camZ+=f[2]*step;
 },{passive:false});
 requestAnimationFrame(frame);
}
main().catch(fail);
