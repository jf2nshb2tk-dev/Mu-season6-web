<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MU Season 6 Web · Lorencia</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020304;color:#eee;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;z-index:4;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));background:#050505d9;border:1px solid #806a39;border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.45;box-shadow:0 3px 18px #000a;pointer-events:none;max-width:78vw}
#hud b{color:#e2c577;font-size:13px}
#status{color:#d8d8d8}
#fps{color:#b8c9a2}
#hint{position:fixed;z-index:4;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));padding:7px 9px;background:#000b;border:1px solid #444;border-radius:7px;color:#bbb;font-size:11px;pointer-events:none}
#error{display:none;position:fixed;inset:0;background:#050505;color:#fff;padding:24px;z-index:10;white-space:pre-wrap;overflow:auto}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"><b>MU Season 6 Web · World1 / Lorencia</b><br><span id="status">Cargando terreno original…</span><br><span id="fps"></span></div>
<div id="hint">Arrastrá: cámara · Pellizco: zoom</div>
<div id="error"></div>
<script>
const $=s=>document.querySelector(s);
const canvas=$("#gl"), statusEl=$("#status"), fpsEl=$("#fps"), errorEl=$("#error");
function fail(e){console.error(e);errorEl.style.display="block";errorEl.textContent="Error cargando Lorencia:\n"+(e?.stack||e);statusEl.textContent="Error";}
const gl=canvas.getContext("webgl2",{antialias:true,alpha:false,powerPreference:"high-performance"});
if(!gl) fail("WebGL 2 no está disponible.");

const WORLD="assets/World1/";
const TILE_FILES=[
 "TileGrass01.OZJ","TileGrass02.OZJ","TileGround01.OZJ","TileGround02.OZJ",
 "TileGround03.OZJ","TileWater01.OZJ","TileWood01.OZJ","TileRock01.OZJ",
 "TileRock02.OZJ","TileRock03.OZJ","TileRock04.OZJ","TileRock05.OZJ",
 "TileRock06.OZJ","TileRock07.OZJ"
];

async function getBytes(name){
 const r=await fetch(WORLD+name,{cache:"no-store"});
 if(!r.ok) throw new Error(name+" HTTP "+r.status);
 return new Uint8Array(await r.arrayBuffer());
}
function findSeq(a,seq,start=0){
 outer:for(let i=start;i<=a.length-seq.length;i++){for(let j=0;j<seq.length;j++)if(a[i+j]!==seq[j])continue outer;return i}return -1;
}
function decodeHeightOZB(bytes){
 const off=findSeq(bytes,[0x42,0x4d]);
 if(off<0) throw new Error("TerrainHeight.OZB: BMP interno no encontrado");
 const dv=new DataView(bytes.buffer,bytes.byteOffset+off,bytes.byteLength-off);
 const px=dv.getUint32(10,true), w=dv.getInt32(18,true), hs=dv.getInt32(22,true), bpp=dv.getUint16(28,true), comp=dv.getUint32(30,true);
 if(bpp!==8||comp!==0) throw new Error("TerrainHeight.OZB no soportado");
 const h=Math.abs(hs), stride=Math.floor((w*bpp+31)/32)*4, out=new Uint8Array(w*h), bottomUp=hs>0;
 for(let y=0;y<h;y++){const sy=bottomUp?(h-1-y):y;out.set(bytes.subarray(off+px+sy*stride,off+px+sy*stride+w),y*w)}
 return {w,h,data:out};
}
async function ozjToCanvas(bytes,size=256){
 if(bytes.length<25)throw new Error("OZJ inválido");
 const jpg=bytes.subarray(24), blob=new Blob([jpg],{type:"image/jpeg"}), url=URL.createObjectURL(blob);
 try{
  const img=new Image();img.decoding="async";
  await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error("JPEG interno OZJ inválido"));img.src=url});
  const c=document.createElement("canvas");c.width=size;c.height=size;const x=c.getContext("2d");
  const topDown=bytes[17]!==0;
  x.save();
  if(!topDown){x.translate(0,size);x.scale(1,-1)}
  x.drawImage(img,0,0,size,size);
  x.restore();
  return c;
 } finally {URL.revokeObjectURL(url)}
}
function parseTerrainMap(bytes){
 if(bytes.length!==196609)throw new Error("Terrain.map inesperado: "+bytes.length+" bytes");
 const n=65536, o=1;
 return {layer1:bytes.slice(o,o+n),layer2:bytes.slice(o+n,o+2*n),alpha:bytes.slice(o+2*n,o+3*n)};
}
function shader(type,src){
 const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;
}
function program(vs,fs){
 const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,vs));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
 if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;
}
const VS=`#version 300 es
precision highp float;
layout(location=0)in vec3 aPos;
layout(location=1)in vec2 aMapUV;
uniform mat4 uMVP;
out vec2 vMapUV;
out float vHeight;
void main(){
 vMapUV=aMapUV;
 vHeight=aPos.y;
 gl_Position=uMVP*vec4(aPos,1.0);
}`;
const FS=`#version 300 es
precision highp float;
in vec2 vMapUV;
in float vHeight;
uniform sampler2D uAtlas;
uniform sampler2D uLayer1;
uniform sampler2D uLayer2;
uniform sampler2D uAlpha;
uniform sampler2D uLight;
uniform float uTime;
out vec4 outColor;

float mapByte(sampler2D t, ivec2 p){
 p=clamp(p,ivec2(0),ivec2(255));
 return floor(texelFetch(t,p,0).r*255.0+0.5);
}
vec3 tileSample(float id, vec2 localUV){
 float col=mod(id,4.0), row=floor(id/4.0);
 vec2 q=clamp(localUV,vec2(.006),vec2(.994));
 return texture(uAtlas,(vec2(col,row)+q)/4.0).rgb;
}
void main(){
 vec2 grid=clamp(vMapUV,0.0,0.999999)*255.0;
 ivec2 cell=ivec2(floor(grid));
 vec2 f=fract(grid);

 float id1=mapByte(uLayer1,cell);
 float id2=mapByte(uLayer2,cell);

 float a00=mapByte(uAlpha,cell)/255.0;
 float a10=mapByte(uAlpha,cell+ivec2(1,0))/255.0;
 float a01=mapByte(uAlpha,cell+ivec2(0,1))/255.0;
 float a11=mapByte(uAlpha,cell+ivec2(1,1))/255.0;
 float a=mix(mix(a00,a10,f.x),mix(a01,a11,f.x),f.y);

 vec2 uv=f;
 if(id1==5.0)uv=fract(uv+vec2(sin(uTime*.45+vMapUV.y*14.0),cos(uTime*.38+vMapUV.x*13.0))*.015);
 vec3 base=tileSample(min(id1,13.0),uv);
 vec3 col=base;
 if(id2<14.0){
   vec2 uv2=f;
   if(id2==5.0)uv2=fract(uv2+vec2(cos(uTime*.32+vMapUV.x*12.0),sin(uTime*.41+vMapUV.y*11.0))*.012);
   col=mix(base,tileSample(id2,uv2),a);
 }

 vec3 light=texture(uLight,vMapUV).rgb;
 float lm=clamp(dot(light,vec3(.3333)),.18,1.0);
 float h=clamp(.82+vHeight/180.0,.82,1.18);
 col*=mix(.72,1.18,lm)*h;
 outColor=vec4(col,1.0);
}`;
const prog=program(VS,FS);
const uMVP=gl.getUniformLocation(prog,"uMVP"),uTime=gl.getUniformLocation(prog,"uTime");

function perspective(fovy,aspect,near,far){
 const f=1/Math.tan(fovy/2),nf=1/(near-far);
 return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,2*far*near*nf,0]);
}
function lookAt(e,t,u){
 let zx=e[0]-t[0],zy=e[1]-t[1],zz=e[2]-t[2],zl=Math.hypot(zx,zy,zz);zx/=zl;zy/=zl;zz/=zl;
 let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx,xl=Math.hypot(xx,xy,xz);xx/=xl;xy/=xl;xz/=xl;
 let yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
 return new Float32Array([xx,yx,zx,0,xy,yy,zy,0,xz,yz,zz,0,-(xx*e[0]+xy*e[1]+xz*e[2]),-(yx*e[0]+yy*e[1]+yz*e[2]),-(zx*e[0]+zy*e[1]+zz*e[2]),1]);
}
function mul(a,b){
 const o=new Float32Array(16);
 for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];
 return o;
}
function byteTex(data,linear=false){
 const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
 gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.R8,256,256,0,gl.RED,gl.UNSIGNED_BYTE,data);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,linear?gl.LINEAR:gl.NEAREST);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,linear?gl.LINEAR:gl.NEAREST);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 return t;
}
function canvasTex(c){
 const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
 gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.generateMipmap(gl.TEXTURE_2D);
 gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
 return t;
}

async function main(){
 if(!gl)return;
 statusEl.textContent="Cargando Terrain.map + 14 texturas originales…";
 const [hb,mb,lb,...tileBytes]=await Promise.all([
   getBytes("TerrainHeight.OZB"),getBytes("Terrain.map"),getBytes("TerrainLight.OZJ"),...TILE_FILES.map(getBytes)
 ]);
 const height=decodeHeightOZB(hb), mapping=parseTerrainMap(mb);

 statusEl.textContent="Armando atlas de texturas MU…";
 const atlas=document.createElement("canvas");atlas.width=1024;atlas.height=1024;const ax=atlas.getContext("2d");
 for(let i=0;i<tileBytes.length;i++){
   const tc=await ozjToCanvas(tileBytes[i],256);
   ax.drawImage(tc,(i%4)*256,Math.floor(i/4)*256);
 }
 const lightCanvas=await ozjToCanvas(lb,256);

 const N=255,cellScale=2.5,heightScale=.22;
 const verts=new Float32Array((N+1)*(N+1)*5);
 const inds=new Uint32Array(N*N*6);
 let k=0;
 for(let z=0;z<=N;z++)for(let x=0;x<=N;x++){
   const hv=height.data[z*256+x]*heightScale;
   verts[k++]=(x-N/2)*cellScale;verts[k++]=hv;verts[k++]=(z-N/2)*cellScale;verts[k++]=x/N;verts[k++]=z/N;
 }
 k=0;
 for(let z=0;z<N;z++)for(let x=0;x<N;x++){
   const a=z*(N+1)+x,b=a+1,c=a+(N+1),d=c+1;
   inds[k++]=a;inds[k++]=c;inds[k++]=b;inds[k++]=b;inds[k++]=c;inds[k++]=d;
 }

 const vao=gl.createVertexArray();gl.bindVertexArray(vao);
 const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,verts,gl.STATIC_DRAW);
 gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,20,0);
 gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,2,gl.FLOAT,false,20,12);
 const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,inds,gl.STATIC_DRAW);

 const atlasTex=canvasTex(atlas), lightTex=canvasTex(lightCanvas);
 const l1Tex=byteTex(mapping.layer1),l2Tex=byteTex(mapping.layer2),alphaTex=byteTex(mapping.alpha);
 gl.useProgram(prog);
 [["uAtlas",atlasTex],["uLayer1",l1Tex],["uLayer2",l2Tex],["uAlpha",alphaTex],["uLight",lightTex]].forEach(([n,t],i)=>{
   gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform1i(gl.getUniformLocation(prog,n),i);
 });
 gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);
 statusEl.textContent="Terrain.map + tiles + luz originales cargados";

 let yaw=-.78,pitch=.80,dist=500,targetY=22,drag=false,lastX=0,lastY=0,pinch=0,lastT=performance.now(),frames=0;
 function resize(){
   const d=Math.min(devicePixelRatio||1,1.45),w=Math.max(1,Math.floor(innerWidth*d)),h=Math.max(1,Math.floor(innerHeight*d));
   if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}
 }
 function frame(t){
   resize();
   const cp=Math.cos(pitch),sp=Math.sin(pitch),eye=[Math.cos(yaw)*cp*dist,sp*dist+targetY,Math.sin(yaw)*cp*dist];
   gl.useProgram(prog);gl.uniformMatrix4fv(uMVP,false,mul(perspective(.68,canvas.width/canvas.height,.1,1800),lookAt(eye,[0,targetY,0],[0,1,0])));gl.uniform1f(uTime,t/1000);
   gl.clearColor(.012,.015,.018,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
   gl.bindVertexArray(vao);gl.drawElements(gl.TRIANGLES,inds.length,gl.UNSIGNED_INT,0);
   frames++;if(t-lastT>750){fpsEl.textContent=Math.round(frames*1000/(t-lastT))+" FPS · 14 tiles MU · Terrain.map real";frames=0;lastT=t}
   requestAnimationFrame(frame);
 }
 canvas.addEventListener("pointerdown",e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
 canvas.addEventListener("pointermove",e=>{if(!drag)return;yaw+=(e.clientX-lastX)*.0055;pitch=Math.max(.28,Math.min(1.28,pitch+(e.clientY-lastY)*.0045));lastX=e.clientX;lastY=e.clientY});
 canvas.addEventListener("pointerup",()=>drag=false);canvas.addEventListener("pointercancel",()=>drag=false);
 canvas.addEventListener("wheel",e=>{e.preventDefault();dist=Math.max(130,Math.min(900,dist+e.deltaY*.3))},{passive:false});
 canvas.addEventListener("touchstart",e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});
 canvas.addEventListener("touchmove",e=>{if(e.touches.length===2){e.preventDefault();const q=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)dist=Math.max(130,Math.min(900,dist+(pinch-q)*.85));pinch=q}},{passive:false});
 canvas.addEventListener("touchend",()=>pinch=0,{passive:true});
 requestAnimationFrame(frame);
}
main().catch(fail);
</script>
</body>
</html>
